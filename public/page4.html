<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Our Universe</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23ff2d55' d='M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;600;700&family=Poppins:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    #space {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    /* ---------- HUD ---------- */
    .hud-top {
      position: absolute;
      top: max(env(safe-area-inset-top), 16px);
      left: 0; right: 0;
      display: flex;
      justify-content: center;
      z-index: 5;
      pointer-events: none;
    }
    .star-count {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 18px;
      font-family: 'Poppins', sans-serif;
      font-size: 12px;
      letter-spacing: 0.2em;
      color: #d9c8d6;
      text-shadow: 0 0 10px rgba(255,255,255,0.3);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 30px;
      background: rgba(10,4,14,0.35);
      -webkit-backdrop-filter: blur(4px);
      backdrop-filter: blur(4px);
    }
    .star-count svg { width: 14px; height: 14px; filter: drop-shadow(0 0 6px rgba(255,210,122,0.7)); }

    .space-hint {
      position: absolute;
      bottom: max(env(safe-area-inset-bottom), 22px);
      left: 0; right: 0;
      text-align: center;
      padding: 0 30px;
      font-family: 'Poppins', sans-serif;
      font-size: 13px;
      font-style: italic;
      color: #cfc0cc;
      text-shadow: 0 0 10px rgba(255,255,255,0.25);
      z-index: 5;
      pointer-events: none;
      transition: opacity 1s ease;
    }
    .space-hint.gone { opacity: 0; }

    /* ---------- overlays ---------- */
    .overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(0,0,0,0.42);
      -webkit-backdrop-filter: blur(3px);
      backdrop-filter: blur(3px);
    }

    .star-card {
      width: min(340px, 86vw);
      padding: 28px 26px 22px;
      text-align: center;
      background: rgba(12,6,16,0.82);
      border: 1px solid rgba(255,45,85,0.35);
      border-radius: 24px;
      box-shadow: 0 0 30px rgba(255,45,85,0.25), 0 0 60px rgba(0,0,0,0.5);
      transform: translateY(12px);
      transition: transform 0.5s ease;
    }
    .overlay.show .star-card { transform: translateY(0); }
    .card-heart { width: 20px; height: 20px; margin: 0 auto 10px; filter: drop-shadow(0 0 8px rgba(255,45,85,0.8)); }
    .star-card h2 {
      font-family: 'Dancing Script', cursive;
      font-weight: 600;
      font-size: clamp(24px, 6.5vw, 30px);
      color: #ffffff;
      text-shadow: 0 0 12px rgba(255,255,255,0.5), 0 0 30px rgba(255,45,85,0.3);
      margin-bottom: 12px;
    }
    .star-card p {
      font-family: 'Poppins', sans-serif;
      font-weight: 300;
      font-size: 14.5px;
      line-height: 1.75;
      color: #e9dde6;
      text-shadow: 0 0 9px rgba(255,255,255,0.22);
    }
    .close-note {
      margin-top: 18px;
      font-family: 'Poppins', sans-serif;
      font-size: 10.5px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #a996a6;
      text-shadow: 0 0 8px rgba(255,255,255,0.15);
    }

    .done-heart svg {
      width: 46px;
      height: 46px;
      filter: drop-shadow(0 0 14px rgba(255,45,85,0.8));
      animation: heartBeat 2.2s ease-in-out infinite;
    }
    .done-msg {
      margin: 20px 0 30px;
      max-width: 340px;
      text-align: center;
      font-family: 'Dancing Script', cursive;
      font-weight: 600;
      font-size: clamp(23px, 6vw, 30px);
      line-height: 1.45;
      color: #ffffff;
      text-shadow: 0 0 14px rgba(255,255,255,0.5), 0 0 40px rgba(255,45,85,0.35);
    }
  </style>
</head>
<body class="bg-black">
  <canvas id="space"></canvas>

  <div class="hud-top">
    <div class="star-count">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#ffd27a" d="M12 2l2.9 6.3 6.9.8-5.1 4.7 1.4 6.8L12 17l-6.1 3.6 1.4-6.8L2.2 9.1l6.9-.8z"/></svg>
      <span id="starCount">0 / 7</span>
    </div>
  </div>

  <p id="spaceHint" class="space-hint">Drag to look around, my love. Tap the glowing stars.</p>

  <!-- memory star card -->
  <div id="starOverlay" class="overlay fx hidden-v">
    <div class="star-card" role="dialog" aria-modal="true" aria-labelledby="starTitle">
      <svg class="card-heart" viewBox="0 0 24 24" aria-hidden="true"><path fill="#ff2d55" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
      <h2 id="starTitle"></h2>
      <p id="starMsg"></p>
      <div class="close-note">tap anywhere to close</div>
    </div>
  </div>

  <!-- all 7 stars found -->
  <div id="doneOverlay" class="overlay fx hidden-v">
    <div class="center-col">
      <div class="done-heart">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#ff2d55" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
      </div>
      <p class="done-msg">You found them all, Dijuuu. Now, one last thing remains.</p>
      <a id="surpriseBtn" class="btn-glow" href="page5.html">One Last Surprise</a>
    </div>
  </div>

  <script src="assets/three.min.js"></script>
  <script src="js/space.js"></script>
</body>
</html>
